<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/dm-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/momo-trust-display-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Hide animated elements until the animation engine has prepared them (no flash),
      // with a safety timeout in case JS fails.
      document.documentElement.classList.replace('no-js', 'js');
      document.documentElement.classList.add('anim-pending');
      setTimeout(function () {
        document.documentElement.classList.remove('anim-pending');
      }, 4000);
    </script>
    <!--ssr-head-->
    <script type="module" src="/src/client/main.js"></script>
  </head>

    <!--ssr-body-->
  </body>
</html>

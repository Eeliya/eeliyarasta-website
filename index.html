<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Momo+Trust+Display&display=swap">
    <script>
      // Hide animated elements until the animation engine has prepared them (no flash),
      // with a safety timeout in case JS fails.
      document.documentElement.classList.replace('no-js', 'js');
      document.documentElement.classList.add('anim-pending');
      setTimeout(function () { document.documentElement.classList.remove('anim-pending'); }, 4000);
    </script>
    <!--ssr-head-->
    <script type="module" src="/src/client/main.js"></script>
  </head>

</html>
